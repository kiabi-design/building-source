
name: Building Source RU - Android APK

run-name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Compile Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check ZIP archive
        run: |
          ls -lah
          test -f Building-source-RU-source.zip

      - name: Extract source
        run: |
          unzip -q Building-source-RU-source.zip
          test -f Building-source-main/gradlew
          ls -lah Building-source-main

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Build APK
        run: |
          cd Building-source-main
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Building-source-RU-APK
          path: Building-source-main/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
